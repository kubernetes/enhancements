<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">AddOns on one hub cluster target two spoke clusters</title>
  <desc id="description">The hub hosts two AddOns, otel-collector-cluster-a and otel-collector-cluster-b. Each targets a ClusterProfile for cluster-a or cluster-b, respectively. Each ClusterProfile represents its corresponding spoke cluster, cluster-a or cluster-b. Dashed arrows show references and the clusters represented by the ClusterProfiles.</desc>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-weight: 400; }
    path.reference { fill: none; stroke: #595959; stroke-width: 1.5; stroke-dasharray: 4 4; }
    path.target { fill: none; stroke: #595959; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>
  <rect width="900" height="300" fill="#ffffff"/>
  <g id="boundaries">
    <rect id="hub-cluster" x="20" y="20" width="500" height="260" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
    <rect id="target-cluster-a" x="640" y="72" width="240" height="86" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
    <rect id="target-cluster-b" x="640" y="182" width="240" height="86" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
  </g>
  <g id="connections">
    <path id="profile-ref-a" class="reference" d="M 227 115 H 313" marker-end="url(#gray-arrow)"/>
    <path id="profile-target-a" class="target" d="M 492 115 H 638" marker-end="url(#gray-arrow)"/>
    <path id="profile-ref-b" class="reference" d="M 227 225 H 313" marker-end="url(#gray-arrow)"/>
    <path id="profile-target-b" class="target" d="M 492 225 H 638" marker-end="url(#gray-arrow)"/>
  </g>
  <g id="resources">
    <g id="addon-a">
    <rect x="50" y="80" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="137.5" y="109" font-size="15" text-anchor="middle" fill="#202020">AddOn</text>
    <text style="font-weight: 400" x="137.5" y="129" font-size="12" text-anchor="middle" fill="#202020">otel-collector-cluster-a</text>
    </g>
    <g id="profile-a">
    <rect x="315" y="80" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="402.5" y="109" font-size="15" text-anchor="middle" fill="#202020">ClusterProfile</text>
    <text style="font-weight: 400" x="402.5" y="129" font-size="12" text-anchor="middle" fill="#202020">cluster-a</text>
    </g>
    <g id="addon-b">
    <rect x="50" y="190" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="137.5" y="219" font-size="15" text-anchor="middle" fill="#202020">AddOn</text>
    <text style="font-weight: 400" x="137.5" y="239" font-size="12" text-anchor="middle" fill="#202020">otel-collector-cluster-b</text>
    </g>
    <g id="profile-b">
    <rect x="315" y="190" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="402.5" y="219" font-size="15" text-anchor="middle" fill="#202020">ClusterProfile</text>
    <text style="font-weight: 400" x="402.5" y="239" font-size="12" text-anchor="middle" fill="#202020">cluster-b</text>
    </g>
  </g>
  <g id="annotations">
    <text style="font-weight: 400" x="40" y="48" font-size="16" text-anchor="start" fill="#202020">Hub cluster</text>
    <text style="font-weight: 400" x="660" y="100" font-size="16" text-anchor="start" fill="#202020">Spoke cluster</text>
    <text x="660" y="125" font-size="12" fill="#202020">cluster-a</text>
    <g id="profile-ref-a-label">
    <rect x="244" y="88" width="52" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="270" y="103" font-size="13" text-anchor="middle" fill="#333333">targets</text>
    </g>
    <g id="profile-target-a-label">
    <rect x="543.5" y="88" width="73" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="580" y="103" font-size="13" text-anchor="middle" fill="#333333">represents</text>
    </g>
    <text style="font-weight: 400" x="660" y="210" font-size="16" text-anchor="start" fill="#202020">Spoke cluster</text>
    <text x="660" y="235" font-size="12" fill="#202020">cluster-b</text>
    <g id="profile-ref-b-label">
    <rect x="244" y="198" width="52" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="270" y="213" font-size="13" text-anchor="middle" fill="#333333">targets</text>
    </g>
    <g id="profile-target-b-label">
    <rect x="543.5" y="198" width="73" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="580" y="213" font-size="13" text-anchor="middle" fill="#333333">represents</text>
    </g>
  </g>
</svg>
