<svg xmlns="http://www.w3.org/2000/svg" width="570" height="210" viewBox="0 0 570 210" role="img" aria-labelledby="title description">
  <title id="title">An AddOn targets its own cluster</title>
  <desc id="description">One Kubernetes cluster hosts an AddOn named otel-collector-local and a ClusterProfile named local-cluster. The AddOn targets that ClusterProfile, which represents the local cluster. The dashed arrow shows the AddOn reference to the ClusterProfile.</desc>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-weight: 400; }
    path.reference { fill: none; stroke: #595959; stroke-width: 1.5; stroke-dasharray: 4 4; }
    path.target { fill: none; stroke: #595959; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>
  <rect width="570" height="210" fill="#ffffff"/>
  <g id="boundaries">
    <rect id="local-cluster" x="20" y="20" width="530" height="170" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
  </g>
  <g id="connections">
    <path id="profile-ref" class="reference" d="M 232 113 H 338" marker-end="url(#gray-arrow)"/>
  </g>
  <g id="resources">
    <g id="addon">
    <rect x="55" y="78" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="142.5" y="107" font-size="15" text-anchor="middle" fill="#202020">AddOn</text>
    <text style="font-weight: 400" x="142.5" y="127" font-size="12" text-anchor="middle" fill="#202020">otel-collector-local</text>
    </g>
    <g id="profile">
    <rect x="340" y="78" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="427.5" y="107" font-size="15" text-anchor="middle" fill="#202020">ClusterProfile</text>
    <text style="font-weight: 400" x="427.5" y="127" font-size="12" text-anchor="middle" fill="#202020">local-cluster</text>
    <text style="font-weight: 400" x="427.5" y="165" font-size="12" text-anchor="middle" fill="#595959">represents this cluster</text>
    </g>
  </g>
  <g id="annotations">
    <text style="font-weight: 400" x="40" y="48" font-size="16" text-anchor="start" fill="#202020">Local cluster</text>
    <g id="profile-ref-label">
    <rect x="259" y="86" width="52" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="285" y="101" font-size="13" text-anchor="middle" fill="#333333">targets</text>
    </g>
  </g>
</svg>
