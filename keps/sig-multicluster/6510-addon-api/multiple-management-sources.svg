<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title description">
  <title id="title">Two hub clusters and a local AddOn request functionality for one spoke cluster</title>
  <desc id="description">Hub cluster A hosts AddOn cert-manager-cluster-a and a cluster-a ClusterProfile. Hub cluster B hosts AddOn cilium-cluster-a and its own cluster-a ClusterProfile. The spoke cluster, cluster-a, also acts as the local cluster for its own AddOn. It hosts AddOn otel-collector-local and a local-cluster ClusterProfile representing itself. Each AddOn targets its respective ClusterProfile. All three ClusterProfiles represent cluster-a. Dashed arrows show references and the clusters represented by the ClusterProfiles.</desc>
  <defs>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-weight: 400; }
    path.reference { fill: none; stroke: #595959; stroke-width: 1.5; stroke-dasharray: 4 4; }
    path.target { fill: none; stroke: #595959; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>
  <rect width="920" height="440" fill="#ffffff"/>
  <g id="boundaries">
    <rect id="hub-a" x="20" y="20" width="420" height="150" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
    <rect id="hub-b" x="480" y="20" width="420" height="150" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
    <rect id="target-cluster" x="100" y="250" width="720" height="170" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5"/>
  </g>
  <g id="connections">
    <path id="profile-ref-a" class="reference" d="M 212 115 H 268" marker-end="url(#gray-arrow)"/>
    <path id="profile-ref-b" class="reference" d="M 708 115 H 652" marker-end="url(#gray-arrow)"/>
    <path id="local-profile-ref" class="reference" d="M 377 345 H 543" marker-end="url(#gray-arrow)"/>
    <path id="profile-target-a" class="target" d="M 345 152 V 248" marker-end="url(#gray-arrow)"/>
    <path id="profile-target-b" class="target" d="M 575 152 V 248" marker-end="url(#gray-arrow)"/>
  </g>
  <g id="resources">
    <g id="addon-a">
    <rect x="40" y="80" width="170" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="125" y="109" font-size="15" text-anchor="middle" fill="#202020">AddOn</text>
    <text style="font-weight: 400" x="125" y="129" font-size="12" text-anchor="middle" fill="#202020">cert-manager-cluster-a</text>
    </g>
    <g id="profile-a">
    <rect x="270" y="80" width="150" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="345" y="109" font-size="15" text-anchor="middle" fill="#202020">ClusterProfile</text>
    <text style="font-weight: 400" x="345" y="129" font-size="12" text-anchor="middle" fill="#202020">cluster-a</text>
    </g>
    <g id="profile-b">
    <rect x="500" y="80" width="150" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="575" y="109" font-size="15" text-anchor="middle" fill="#202020">ClusterProfile</text>
    <text style="font-weight: 400" x="575" y="129" font-size="12" text-anchor="middle" fill="#202020">cluster-a</text>
    </g>
    <g id="addon-b">
    <rect x="710" y="80" width="170" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="795" y="109" font-size="15" text-anchor="middle" fill="#202020">AddOn</text>
    <text style="font-weight: 400" x="795" y="129" font-size="12" text-anchor="middle" fill="#202020">cilium-cluster-a</text>
    </g>
    <g id="local-addon">
    <rect x="200" y="310" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="287.5" y="339" font-size="15" text-anchor="middle" fill="#202020">AddOn</text>
    <text style="font-weight: 400" x="287.5" y="359" font-size="12" text-anchor="middle" fill="#202020">otel-collector-local</text>
    </g>
    <g id="local-profile">
    <rect x="545" y="310" width="175" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2"/>
    <text style="font-weight: 400" x="632.5" y="339" font-size="15" text-anchor="middle" fill="#202020">ClusterProfile</text>
    <text style="font-weight: 400" x="632.5" y="359" font-size="12" text-anchor="middle" fill="#202020">local-cluster</text>
    <text style="font-weight: 400" x="632.5" y="397" font-size="12" text-anchor="middle" fill="#595959">represents this cluster</text>
    </g>
  </g>
  <g id="annotations">
    <text style="font-weight: 400" x="40" y="48" font-size="16" text-anchor="start" fill="#202020">Hub cluster A</text>
    <text style="font-weight: 400" x="500" y="48" font-size="16" text-anchor="start" fill="#202020">Hub cluster B</text>
    <g id="profile-ref-a-label">
    <rect x="214" y="88" width="52" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="240" y="103" font-size="13" text-anchor="middle" fill="#333333">targets</text>
    </g>
    <g id="profile-ref-b-label">
    <rect x="654" y="88" width="52" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="680" y="103" font-size="13" text-anchor="middle" fill="#333333">targets</text>
    </g>
    <text style="font-weight: 400" x="120" y="278" font-size="16" text-anchor="start" fill="#202020">Spoke cluster</text>
    <text x="120" y="299" font-size="12" fill="#202020">cluster-a (also the local cluster for otel-collector-local)</text>
    <g id="local-profile-ref-label">
    <rect x="434" y="318" width="52" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="460" y="333" font-size="13" text-anchor="middle" fill="#333333">targets</text>
    </g>
    <g id="profile-target-a-label">
    <rect x="355" y="191" width="73" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="361" y="206" font-size="13" text-anchor="start" fill="#333333">represents</text>
    </g>
    <g id="profile-target-b-label">
    <rect x="585" y="191" width="73" height="21" rx="3" fill="#ffffff"/>
    <text style="font-weight: 400" x="591" y="206" font-size="13" text-anchor="start" fill="#333333">represents</text>
    </g>
  </g>
</svg>
