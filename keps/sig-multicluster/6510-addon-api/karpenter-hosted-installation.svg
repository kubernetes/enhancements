<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="530" viewBox="0 0 1160 530" role="img" aria-labelledby="title description">
  <title id="title">Karpenter on the hub provisions Nodes for cluster-a</title>
  <desc id="description">The AddOn fleet-prod/karpenter-cluster-a targets the ClusterProfile fleet-prod/cluster-a, which represents the spoke cluster cluster-a. The AddOn Manager runs on the hub, installs the Karpenter controller there, and configures Karpenter CRDs on cluster-a. The controller accesses the spoke API server remotely; no Karpenter controller Pods run on cluster-a. A user-created NodePool leads to a Karpenter-created NodeClaim, or a user creates a NodeClaim directly. Both NodeClaim paths track a Node in cluster-a, backed by a cloud instance provisioned by Karpenter outside the spoke cluster. Dashed arrows show references and relationships to the cluster and its infrastructure; solid arrows show management operations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959" />
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-weight: 400; fill: #202020; }
    .kind { font-size: 15px; text-anchor: middle; }
    .detail { font-size: 12px; text-anchor: middle; }
    .flow { fill: none; stroke: #595959; stroke-width: 1.5; marker-end: url(#arrow); }
    .reference { stroke-dasharray: 4 4; }
  </style>
  <rect width="1160" height="530" fill="#ffffff" />
  <g id="boundaries">
    <rect id="hub" x="20" y="20" width="385" height="325" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5" />
    <rect id="target" x="495" y="20" width="440" height="490" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5" />
    <rect id="cloud" x="985" y="305" width="155" height="205" rx="6" fill="#f3f3f3" stroke="#595959" stroke-width="1.5" />
  </g>
  <g id="connections">
    <path id="reconcile-addon" class="flow" d="M 233 115 H 192" />
    <path id="profile-ref" class="flow reference" d="M 117.5 152 V 223" />
    <path id="install-controller" class="flow" d="M 310 152 V 223" />
    <path id="configure-target" class="flow" d="M 387 115 H 513" />
    <path id="profile-target" class="flow reference" d="M 192 260 H 210 V 315 H 493" />
    <path id="remote-reconcile" class="flow" d="M 387 260 H 513" />
    <path id="create-nodeclaim" class="flow" d="M 627 380 H 698" />
    <path id="track-node" class="flow reference" d="M 817 380 H 858" />
    <path id="track-direct-node" class="flow reference" d="M 817 465 H 887.5 V 417" />
    <path id="node-instance" class="flow reference" d="M 917 380 H 1003" />
  </g>
  <g id="resources">
    <g id="addon">
      <rect x="45" y="80" width="145" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="117.5" y="99.0" style="font-weight: 400">AddOn</text>
      <text class="detail" x="117.5" y="119.0" style="font-weight: 400">karpenter-cluster-a</text>
      <text class="detail" x="117.5" y="139.0" style="font-weight: 400">namespace: fleet-prod</text>
    </g>
    <g id="profile">
      <rect x="45" y="225" width="145" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="117.5" y="244.0" style="font-weight: 400">ClusterProfile</text>
      <text class="detail" x="117.5" y="264.0" style="font-weight: 400">cluster-a</text>
      <text class="detail" x="117.5" y="284.0" style="font-weight: 400">namespace: fleet-prod</text>
    </g>
    <g id="manager">
      <rect x="235" y="80" width="150" height="70" rx="24" fill="#cfe2f3" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="310.0" y="109.0" style="font-weight: 400">AddOn Manager</text>
      <text class="detail" x="310.0" y="129.0" style="font-weight: 400">reconciles AddOn</text>
    </g>
    <g id="controller">
      <rect x="235" y="225" width="150" height="70" rx="24" fill="#cfe2f3" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="310.0" y="254.0" style="font-weight: 400">Karpenter</text>
      <text class="kind" x="310.0" y="274.0" style="font-weight: 400">controller</text>
    </g>
    <g id="target-config">
