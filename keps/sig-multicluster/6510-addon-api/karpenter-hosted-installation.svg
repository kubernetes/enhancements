      <text class="kind" x="570.0" y="374.0" style="font-weight: 400">NodePool</text>
      <text class="detail" x="570.0" y="394.0" style="font-weight: 400">created by user</text>
    </g>
    <g id="nodeclaim">
      <rect x="700" y="345" width="115" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="757.5" y="374.0" style="font-weight: 400">NodeClaim</text>
      <text class="detail" x="757.5" y="394.0" style="font-weight: 400">by Karpenter</text>
    </g>
    <g id="direct-nodeclaim">
      <rect x="700" y="435" width="115" height="60" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="757.5" y="459.0" style="font-weight: 400">NodeClaim</text>
      <text class="detail" x="757.5" y="479.0" style="font-weight: 400">created by user</text>
    </g>
    <g id="node">
      <rect x="860" y="345" width="55" height="70" rx="6" fill="#fff2cc" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="887.5" y="384.0" style="font-weight: 400">Node</text>
    </g>
    <g id="instance">
      <rect x="1005" y="345" width="115" height="70" rx="6" fill="#ffffff" stroke="#595959" stroke-width="1.2" />
      <text class="kind" x="1062.5" y="374.0" style="font-weight: 400">Instance</text>
      <text class="detail" x="1062.5" y="394.0" style="font-weight: 400">by Karpenter</text>
    </g>
  </g>
  <g id="annotations">
    <text x="40" y="48" font-size="16" style="font-weight: 400">Hub cluster</text>
    <text x="515" y="44" font-size="16" style="font-weight: 400">Spoke cluster</text>
    <text x="515" y="63" font-size="12">cluster-a</text>
    <text x="1005" y="333" font-size="16" style="font-weight: 400">Cloud provider</text>
    <g id="profile-ref-label">
