      <text x="133" y="190" font-size="13" text-anchor="start" fill="#333333" style="font-weight: 400">targets</text>
    </g>
    <g id="install-controller-label">
      <rect x="319" y="175" width="54.0" height="21" rx="3" fill="#ffffff" />
      <text x="325" y="190" font-size="13" text-anchor="start" fill="#333333" style="font-weight: 400">installs</text>
    </g>
    <g id="configure-target-label">
      <rect x="413.5" y="88" width="73.0" height="21" rx="3" fill="#ffffff" />
      <text x="450" y="103" font-size="13" text-anchor="middle" fill="#333333" style="font-weight: 400">configures</text>
    </g>
    <g id="profile-target-label">
      <rect x="413.0" y="288" width="74.0" height="21" rx="3" fill="#ffffff" />
      <text x="450" y="303" font-size="13" text-anchor="middle" fill="#333333" style="font-weight: 400">represents</text>
    </g>
    <g id="remote-reconcile-label">
      <rect x="386.5" y="233" width="127.0" height="21" rx="3" fill="#ffffff" />
      <text x="450" y="248" font-size="13" text-anchor="middle" fill="#333333" style="font-weight: 400">remote API access</text>
    </g>
    <g id="create-nodeclaim-label">
      <rect x="636.5" y="353" width="52" height="21" rx="3" fill="#ffffff" />
      <text x="662.5" y="368" font-size="13" text-anchor="middle" fill="#333333" style="font-weight: 400">creates</text>
    </g>
    <g id="track-node-label">
      <rect x="817" y="353" width="41" height="21" rx="3" fill="#ffffff" />
      <text x="837.5" y="368" font-size="13" text-anchor="middle" fill="#333333" style="font-weight: 400">tracks</text>
    </g>
    <g id="node-instance-label">
      <rect x="923.5" y="353" width="73.0" height="21" rx="3" fill="#ffffff" />
      <text x="960" y="368" font-size="13" text-anchor="middle" fill="#333333" style="font-weight: 400">backed by</text>
    </g>
    <g id="controller-absence">
      <rect x="515" y="170" width="400" height="35" rx="6" fill="#ffffff" stroke="#595959" stroke-width="1.2" />
      <text x="715" y="193" font-size="15" text-anchor="middle" style="font-weight: 400">No Karpenter controller Pods on cluster-a</text>
    </g>
  </g>
</svg>
