  <line x1="330.0" y1="765.0" x2="450.0" y2="765.0" stroke="#3c78d8" stroke-width="1"/>
  <line x1="330.0" y1="771.0" x2="450.0" y2="771.0" stroke="#bf9000" stroke-width="1"/>
  <line x1="329.1" y1="762.1" x2="599.1" y2="677.1" stroke="#6aa84f" stroke-width="1"/>
  <line x1="330.9" y1="767.9" x2="600.9" y2="682.9" stroke="#3c78d8" stroke-width="1"/>
  <line x1="330.9" y1="762.1" x2="600.9" y2="847.1" stroke="#6aa84f" stroke-width="1"/>
  <line x1="329.1" y1="767.9" x2="599.1" y2="852.9" stroke="#3c78d8" stroke-width="1"/>
