  <!-- clustersets, one dashed outline per distinct set of clusters: web and api share one, db has its own -->
  <rect x="75" y="50" width="820" height="285" rx="12" fill="none" stroke="#595959" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="75" y="345" width="340" height="145" rx="12" fill="none" stroke="#595959" stroke-width="1.5" stroke-dasharray="6,4"/>
