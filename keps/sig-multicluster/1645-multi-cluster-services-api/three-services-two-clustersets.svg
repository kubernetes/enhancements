  <text x="140" y="100" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">web</text>
  <rect x="85" y="130" width="110" height="55" fill="#d9ead3" stroke="#595959" stroke-width="1"/>
