  <text x="330" y="769.5" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">Cluster A</text>
  <rect x="414" y="752" width="72" height="26" rx="4" fill="#ffffff" stroke="#595959" stroke-width="1"/>
  <text x="450" y="769.5" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">Cluster B</text>
